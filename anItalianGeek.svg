<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="anItalianGeek — SWE at Sorgetech, Electronic and Computer Engineering at UniFe">
  <title>anItalianGeek</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171208"/>
      <stop offset="100%" stop-color="#0D0A06"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }

    .gutter  { fill: #46381F; font-size: 18px; }
    .name    { font-size: 56px; }
    .comment { fill: #6E7B5E; font-size: 18px; }

    /* characters land dim, as if the highlighter hasn't caught up yet */
    .c {
      fill: #6B5F4E;
      opacity: 1;
      animation: type .01s linear backwards, hl .45s ease-out forwards;
    }
    .s1 { --tint: #7FB8C9; }
    .s2 { --tint: #F0A93C; }
    .s3 { --tint: #D98B7E; }

    @keyframes type { from { opacity: 0 } to { opacity: 1 } }
    @keyframes hl   { to   { fill: var(--tint) } }

    /* the cursor advances one cell per keystroke, then starts blinking */
    .cursor {
      fill: #F5EAD6;
      animation: advance .975s steps(13, jump-start) .15s forwards,
                 blink 1.05s steps(1) 1.15s infinite;
    }
    @keyframes advance { to { transform: translateX(442px) } }
    @keyframes blink   { 0%,52% { opacity: 1 } 53%,100% { opacity: 0 } }

    .g1      { animation: fade .4s ease-out .05s backwards; }
    .g2, .cm { animation: fade .5s ease-out 2.25s backwards; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .c { animation: none }
      .s1 { fill: #7FB8C9 } .s2 { fill: #F0A93C } .s3 { fill: #D98B7E }
      .cursor { animation: none; transform: translateX(442px) }
      .g1, .g2, .cm { animation: none }
    }
  </style>

  <rect width="880" height="200" rx="10" fill="url(#bg)"/>

  <g class="mono">
    <text class="gutter g1" x="40" y="106">1</text>
    <text class="name" y="106"><tspan class="c s1" x="88" style="animation-delay:0.15s,1.6s">a</tspan><tspan class="c s1" x="122" style="animation-delay:0.225s,1.635s">n</tspan><tspan class="c s2" x="156" style="animation-delay:0.3s,1.67s">I</tspan><tspan class="c s2" x="190" style="animation-delay:0.375s,1.705s">t</tspan><tspan class="c s2" x="224" style="animation-delay:0.45s,1.74s">a</tspan><tspan class="c s2" x="258" style="animation-delay:0.525s,1.775s">l</tspan><tspan class="c s2" x="292" style="animation-delay:0.6s,1.81s">i</tspan><tspan class="c s2" x="326" style="animation-delay:0.675s,1.845s">a</tspan><tspan class="c s2" x="360" style="animation-delay:0.75s,1.88s">n</tspan><tspan class="c s3" x="394" style="animation-delay:0.825s,1.915s">G</tspan><tspan class="c s3" x="428" style="animation-delay:0.9s,1.95s">e</tspan><tspan class="c s3" x="462" style="animation-delay:0.975s,1.985s">e</tspan><tspan class="c s3" x="496" style="animation-delay:1.05s,2.02s">k</tspan></text>

    <rect class="cursor" x="88" y="68" width="26" height="44" rx="1"/>

    <text class="gutter g2" x="40" y="158">2</text>
    <text class="comment cm" x="88" y="158">// SWE @ Sorgetech &amp;&amp; Electronic and Computer Engineering @ UniFe</text>
  </g>
</svg>
